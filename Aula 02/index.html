<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Crie seu personagem colocando as informações nesse formulario.</h1>

    <form>
        <fieldset class="Dados do Heroi">
            <legend>Dados do Seu Heroi</legend>
            <label for="">Nome do Personagem</label>
            <input type="text"  class="nameP">
            <br> <br>
            <label for="">Senha</label>
            <input type="password"  class="password">
            <br> <br>
            <label for="">Color</label>
            <input type="color">
        </fieldset>
        <br> 
        <fieldset>
            <legend>Atributos e Classes</legend>
            <label for="">Classe</label>
                <select name="" id="">
                    <option value="">Guerreiro</option>
                    <option value="">Mago</option>
                    <option value="">Arqueiro</option>
                    <option value="">Hacker</option>
                </select>
            <br> <br>
            <label for="">Nivel da Força</label>
            <input type="range">
        </fieldset>
        <br> 
        <fieldset>
            <legend>Equipamento e Origem</legend>
            <label for="">Intens no Inventario</label>
            <br>
            <label for="">Capa</label>
            <input type="checkbox" >
            <br>
            <label for="">Espada</label>
            <input type="checkbox" >
            <br>
            <label for="">Poção</label>
            <input type="checkbox" >
            <br>
            <label for="">Laptop</label>
            <input type="checkbox" >

            <datalist id="teste">
                <option value="SP">
                    <option value="dd">
                        <label for="">da</label>
                    </option>
                <input type="text" name="" id="">
            </datalist>
            
        </fieldset>
        <br>
        <fieldset>
            <legend>Historia do Personagem</legend>
            <label>Historia do Personagem</label><br>
            <textarea name="" id="" cols="30" rows="5"></textarea>
            <br>
            <label>BackStory</label> <br>
            <textarea name="" id="" cols="30" rows="5"></textarea>
        </fieldset>
        <br>
    </form>
</body>
</html>
