<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="form-section">
            <h2>Nova Nota</h2>
            <form id="InfoNotas">
                <div class="input-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Digite o título da nota">
                </div>
                <div class="input-group">
                    <label for="info">Conteúdo</label>
                    <textarea id="info" placeholder="Escreva sua nota aqui..." rows="8"></textarea>
                </div>
                <button type="submit" id="EnviarNota">Salvar Nota</button>
            </form>
        </div>

        
        <div class="notes-section">
            <h2>Minhas Notas <span id="contador">(0)</span></h2>
            <div id="Notas" class="notes-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
