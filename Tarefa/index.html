<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id="Titulo">Catalago de Filmes</h1>

    <form id="inventario">
        <div class="campo">
            <label for="NomeItem">Nome do Filme</label>
            <input type="text" id="NomeItem" placeholder="Ex: Homem aranha">
        </div>

        <div class="campo">
            <label for="DescricaoItem">Genero</label>
           
            <textarea id="DescricaoItem" placeholder="Ex: Terror"></textarea>
        </div>

        <button type="submit" class="btn-add">Adicionar à Catalago</button>
    </form>

    <div id="mochila-container">

    </div>

    <script src="script.js"></script>
</body>
</html>
